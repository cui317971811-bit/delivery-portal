{% extends "base.html" %}
{% block title %}登录 - 中压物料交期门户{% endblock %}
{% block body %}
  <div class="login-box">
    <h1>供应商登录</h1>
    <p class="sub">请输入您的账号（供应商名称）与密码</p>
    <form method="post" action="{{ url_for('login_action') }}">
      <label for="username">账号（供应商名称）</label>
      <input type="text" id="username" name="username" placeholder="如：明阳 / 北京ABB" required autofocus>
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required>
      <div style="margin-top:18px">
        <button class="btn" type="submit" style="width:100%">登 录</button>
      </div>
    </form>
    <p class="hint">首次使用请联系管理员获取账号与初始密码；登录后可在“我的订单”中在线更新「供应商回复」与「备注」。</p>
  </div>
{% endblock %}
